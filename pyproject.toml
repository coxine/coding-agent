[project]
name = "coding-agent"
version = "0.1.0"
description = "A local coding agent with a TypeScript TUI and Python core"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0,<3",
  "python-dotenv>=1.0.0,<2",
]

[project.scripts]
coding-agent-core = "agent_coder.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=0.24.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_coder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
